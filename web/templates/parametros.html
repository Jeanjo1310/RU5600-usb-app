{% extends "base.html" %}
{% block title %}Parámetros{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow-sm p-6 mb-4">
  <h2 class="text-lg font-semibold mb-3">Parámetros del lector</h2>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3 items-start">
    <div><label class="block text-sm mb-1" for="rf">RF Power</label><select id="rf" class="select select-bordered w-full"></select></div>
    <div><label class="block text-sm mb-1" for="band">Banda</label><select id="band" class="select select-bordered w-full"></select></div>
    <div><label class="block text-sm mb-1" for="wm">WorkMode</label><select id="wm" class="select select-bordered w-full"><option value="0">AnswerMode</option><option value="1">ActiveMode</option></select></div>
    <div><label class="block text-sm mb-1" for="filt">FilterTime(s)</label><input id="filt" value="0" class="input input-bordered w-full"></div>
    <div><div class="text-sm mb-1">Buzzer</div><label class="flex items-center gap-2 text-sm pt-1.5"><input id="beep" type="checkbox" class="checkbox checkbox-sm"> Activo</label></div>
  </div>
  <div class="flex flex-wrap gap-2">
    <button id="pread" class="btn btn-soft btn-success">Leer</button>
    <button id="papply" class="btn btn-primary">Aplicar</button>
    <button id="pdef" class="btn btn-outline">Defecto</button>
    <button id="psil" class="btn btn-outline">Silenciar ya</button>
  </div>
  <h3 class="text-md font-semibold mt-4 mb-2">Lectura por defecto (para Leer/Escribir)</h3>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
    <div><label class="block text-sm mb-1" for="dmem">Área</label><select id="dmem" class="select select-bordered w-full"><option>EPC</option><option>TID</option><option>USER</option></select></div>
    <div><label class="block text-sm mb-1" for="dptr">Inicio (hex)</label><input id="dptr" value="00" class="input input-bordered w-full"></div>
    <div><label class="block text-sm mb-1" for="dlen">Longitud (hex)</label><input id="dlen" value="06" class="input input-bordered w-full"></div>
    <div><label class="block text-sm mb-1" for="drt">ReadTime</label><input id="drt" value="2" class="input input-bordered w-full"></div>
  </div>
  <h3 class="text-md font-semibold mt-4 mb-2">Salida teclado (cuña: solo app de escritorio)</h3>
  <div class="grid grid-cols-2 gap-2">
    <div><label class="block text-sm mb-1" for="dout">Formato</label><select id="dout" class="select select-bordered w-full"><option>All(Hex)</option><option>EPC(HEX)</option><option>EPC(ASCII)</option></select></div>
    <div><div class="text-sm mb-1">Fin de lectura</div><label class="flex items-center gap-2 text-sm pt-1.5"><input type="checkbox" class="checkbox checkbox-sm" id="denter" checked> OutWithEnterKey</label></div>
  </div>
  <p id="pmsg" class="mt-2 text-sm"></p>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadBands() {
  for (let v = 0; v <= 30; v++) { const o = document.createElement('option'); o.textContent = v + 'dBm'; document.getElementById('rf').appendChild(o); }
  const bands = ["USA","Europe","China","Korea","Australia","Singapore","Taiwan","Canada","Brazil","Israel","South Africa","Thailand","Malaysia","Japan","New Zealand","India","Hongkong","Mexico"];
  const b = document.getElementById('band'); bands.forEach(x => { const o = document.createElement('option'); o.textContent = x; b.appendChild(o); });
}
loadBands();
document.getElementById('pread').onclick = async () => {
  const r = await post('/api/params_read', {});
  if (r.ok) {
    document.getElementById('rf').selectedIndex = r.rf;
    document.getElementById('wm').value = String(r.mode);
    document.getElementById('beep').checked = !!r.beep;
    document.getElementById('filt').value = r.filter;
    document.getElementById('pmsg').textContent = 'Frecuencia: ' + r.freq;
  } else document.getElementById('pmsg').textContent = 'Error: ' + r.error;
};
document.getElementById('papply').onclick = async () => {
  for (const k of ['dmem','dptr','dlen','drt','dout']) localStorage.setItem('ru5600_'+k, document.getElementById(k).value);
  localStorage.setItem('ru5600_denter', document.getElementById('denter').checked ? '1' : '0');
  const r = await post('/api/params_apply', {rf: document.getElementById('rf').selectedIndex, mode: parseInt(document.getElementById('wm').value), beep: document.getElementById('beep').checked, filter: document.getElementById('filt').value});
  document.getElementById('pmsg').textContent = r.ok ? 'Aplicado.' : 'Error: ' + r.error;
};
for (const k of ['dmem','dptr','dlen','drt','dout']) { const v = localStorage.getItem('ru5600_'+k); if (v !== null) document.getElementById(k).value = v; }
if (localStorage.getItem('ru5600_denter') === '0') document.getElementById('denter').checked = false;
document.getElementById('psil').onclick = async () => {
  const r = await post('/api/silence', {});
  document.getElementById('pmsg').textContent = r.ok ? 'Silenciado.' : 'Error: ' + r.error;
};
document.getElementById('pdef').onclick = () => {
  document.getElementById('rf').selectedIndex = 15;
  document.getElementById('band').selectedIndex = 0;
  document.getElementById('wm').value = '0';
  document.getElementById('filt').value = '0';
  document.getElementById('beep').checked = true;
  document.getElementById('pmsg').textContent = 'Defecto (UI). Usá Aplicar para mandarlo al lector.';
};
</script>
{% endblock %}
