<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RU5600 · {% block title %}{% endblock %}</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/tailwindcss" />
</head>
<body>
<div class="navbar bg-base-100 shadow">
  <div class="max-w-screen-xl mx-auto flex items-center justify-between w-full px-4">
    <span class="text-xl font-semibold">RU5600 Reader</span>
    <button id="themeBtn" class="btn btn-ghost btn-sm">Claro / Oscuro</button>
  </div>
</div>
<div class="max-w-screen-xl mx-auto p-4">
  <div class="flex flex-wrap gap-2 mb-4">
    <a class="btn btn-ghost btn-sm" href="/conexion">Conexión</a>
    <a class="btn btn-ghost btn-sm" href="/parametros">Parámetros</a>
    <a class="btn btn-ghost btn-sm" href="/leer">Leer/Escribir</a>
    <a class="btn btn-ghost btn-sm" href="/activa">Lectura continua</a>
    <a class="btn btn-ghost btn-sm" href="/avanzado">Avanzado</a>
    <a class="btn btn-ghost btn-sm" href="/chip">Chip info</a>
    <a class="btn btn-ghost btn-sm" href="/riesgo">Peligroso</a>
    <a class="btn btn-ghost btn-sm" href="/blanca">Lista blanca</a>
    <a class="btn btn-ghost btn-sm" href="/lote">Lote</a>
    <a class="btn btn-ghost btn-sm" href="/barrido">Barrido</a>
  </div>
  {% block content %}{% endblock %}
</div>
<footer class="max-w-screen-xl mx-auto px-4 pb-6 text-sm opacity-70">RU5600 · Linux + Android · REA</footer>
<script>
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  return r.json();
}
document.getElementById('themeBtn').onclick = () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'light' ? 'dark' : 'light';
};
</script>
{% block scripts %}{% endblock %}
</body>
</html>
