try { var _tt = localStorage.getItem('ru5600_theme'); if (_tt === 'dark' || _tt === 'light') { document.documentElement.dataset.theme = _tt; } } catch (e) {}

<body class="bg-base-200 text-base-content">
<div class="navbar bg-base-100 shadow">

    <span class="text-xl font-semibold">RU5600 Reader</span>
    <div class="flex items-center gap-5">
      <label class="flex items-center gap-2 text-sm cursor-pointer select-none" title="Idioma / Language">
        <span data-lang-side="es" class="font-semibold">ES</span>
        <input id="langSwitch" type="checkbox" class="toggle toggle-sm toggle-primary">
        <span data-lang-side="en" class="opacity-50">EN</span>
      </label>
      <label class="flex items-center gap-2 text-sm cursor-pointer select-none" title="Tema / Theme">
        <span data-theme-side="light" class="font-semibold">Claro</span>
        <input id="themeSwitch" type="checkbox" class="toggle toggle-sm toggle-primary">
        <span data-theme-side="dark" class="opacity-50">Oscuro</span>
      </label>
      <button id="helpTopBtn" class="btn btn-outline btn-sm btn-square" title="Ayuda (F1)" aria-label="Ayuda">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
    </div>
  </div>
</div>
<div class="max-w-screen-xl mx-auto p-4">

    <a role="tab" class="tab" data-path="/conexion" href="/conexion">Conexión</a>
    <a role="tab" class="tab" data-path="/parametros" href="/parametros">Parámetros</a>
    <a role="tab" class="tab" data-path="/leer" href="/leer">Leer/Escribir</a>
    <a role="tab" class="tab" data-path="/activa" href="/activa">Lectura continua</a>
    <a role="tab" class="tab" data-path="/chip" href="/chip">Chip info</a>
    <a role="tab" class="tab" data-path="/riesgo" href="/riesgo">Peligroso</a>
    <a role="tab" class="tab" data-path="/blanca" href="/blanca">Lista blanca</a>
    <a role="tab" class="tab" data-path="/lote" href="/lote">Lote</a>

</div>

re writing; the other columns are ignored.","Descargar plantilla":"Download template","Planilla (.xlsx o .csv)":"Sheet (.xlsx or .csv)","EPC actual":"Current EPC","EPC nuevo":"New EPC","Iniciar cambio":"Start change","Veces = cuántas veces se releyó ese tag (no crea filas nuevas). Ant = antena que lo leyó. RSSI = fuerza de la señal: cuanto más cerca de 0, mejor. Crudo = la trama tal como llega del lector.":"Times = how many times that tag was read again (no new rows). Ant = antenna that read it. RSSI = signal strength: closer to 0 is better. Raw = the frame exactly as it arrives from the reader.","Frecuencia cruda es el valor interno que reporta el lector; no está en MHz ni es un canal. Sirve como referencia: leela antes y después de grabar la banda, y si cambia, la grabación se aplicó.":"Raw frequency is the internal value the reader reports; it is not in MHz and not a channel. Use it as a reference: read it before and after writing the band, and if it changes, the write was applied.","Servidor TCP":"TCP server","Escribir EPC secuenciales por lote":"Write sequential EPCs by batch","Cada tag que aparece recibe el siguiente EPC de la serie. El primero es el EPC inicial; después se le suma el incremento por cada tag.":"Every tag that shows up gets the next EPC in the series. The first one is the starting EPC; after that the step is added for each tag.","EPC inicial (hex)":"Starting EPC (hex)","24 caracteres hex (12 bytes). Es el EPC del primer tag del lote.":"24 hex characters (12 bytes). The EPC of the first tag in the batch.","Incremento (hex)":"Step (hex)","Cuánto se le suma al EPC en cada tag. 1 = correlativo.":"Added to the EPC for each tag. 1 = consecutive.","EPC escrito":"EPC written","Cómo funciona la lista blanca":"How the whitelist works","La lista vive en el lector: guarda los EPC que el lector tiene autorizados. Esta pantalla lee y escribe esa tabla directamente, no una copia local.":"The list lives in the reader: it holds the EPCs the reader is allowed to accept. This screen reads and writes that table directly, not a local copy.","Actualizar trae la lista real del lector: cuántas entradas tiene y cuáles son.":"Refresh brings the real list from the reader: how many entries it holds and which ones.","Agregar suma una entrada escrita en hex, hasta 32 bytes.":"Add stores one entry written in hex, up to 32 bytes.","Importar carga varias de una vez, un EPC por línea.":"Import loads several at once, one EPC per line.","Borrar quita una entrada; Borrar todas vacía la tabla completa.":"Delete removes one entry; Delete all empties the whole table.","Los cambios quedan grabados en el lector y sobreviven a cerrar la aplicación.":"Changes are stored in the reader and survive closing the application.","? Ayuda":"? Help","Exportar/Importar config guardan y restauran los parámetros del lector en un archivo. Cerrar relé y Liberar relé conmutan el contacto del relé del lector.":"Export/Import config save and restore the reader settings in a file. Close relay and Release relay toggle the reader relay contact.","Lee durante el tiempo indicado y suma tags distintos: la relectura del mismo tag no crea fila nueva. Apoyá el cursor en el EPC para ver la trama cruda.":"Reads for the given time and adds distinct tags: re-reading the same tag creates no new row. Hover the EPC to see the raw frame.","Banco":"Bank","Un mal bloqueo deja el tag inservible para siempre, y un comando mal enviado puede dejar el lector sin responder hasta reiniciarlo.":"A bad lock bricks the tag forever, and a badly sent command can leave the reader unresponsive until it is rebooted.","A · Bloquear un tag para siempre":"A · Lock a tag forever","Deja el tag fijo: no se puede volver a escribir ni desbloquear. Usalo solo en tags que ya van a quedar pegados a su producto final. Antes de bloquear, leé el tag en Leer/Escribir y guardá su EPC.":"Makes the tag permanent: it cannot be written or unlocked again. Use it only on tags already fixed to their final product. Before ber of tags","Cuántos tags se van a escribir. Podés frenar cuando quieras con Parar.":"How many tags will be written. You can stop at any time with Stop.","Verificación":"Verification","Relee el EPC grabado y lo compara con el esperado.":"Reads the written EPC back and compares it with the expected one.","Bloqueo":"Lock","Bloquear tras escribir":"Lock after writing","Deja el tag sin posibilidad de reescritura. Conviene hacerlo aparte, en Peligroso.":"Leaves the tag with no chance of being rewritten. Better to do it separately, in Dangerous.","Frecuencia cruda:":"Raw frequency:","Reiniciar el lector corta la conexión unos segundos; después volvé a abrirla en Conexión.":"Rebooting the reader drops the connection for a few seconds; open it again in Connection afterwards.","Conexión":"Connection","Parámetros":"Parameters","Leer/Escribir":"Read/Write","Lectura continua":"Continuous reading","Avanzado":"Advanced","Chip info":"Chip info","Peligroso":"Dangerous","Lista blanca":"Whitelist","Lote":"Batch","Barrido":"Sweep","Claro / Oscuro":"Light / Dark","RU5600 · Linux + Android · REA":"RU5600 · Linux + Android · REA","Idioma y apariencia":"Language and theme","Fin de lectura":"End of read","Activo":"Enabled","Idioma":"Language","Tema":"Theme","Oscuro":"Dark","Claro":"Light","Transporte":"Transport","Velocidad":"Baud rate","Puerto":"Port","Modo de lectura":"Read mode","Ráfaga (rápido)":"Burst (fast)","Balanceado":"Balanced","Confiable":"Reliable","IP de red":"Network IP","Puerto de red":"Network port","Abrir":"Open","Cerrar":"Close","Escanear puerto":"Scan port","Escanear red":"Scan network","TCPServer":"TCPServer","Ayuda":"Help","Instalar regla de acceso USB":"Install USB access rule","Dispositivo":"Device","N. de serie":"Serial number","Firmware":"Firmware","Hardware":"Hardware","Exportar config":"Export config","Importar config":"Import config","Cerrar relé":"Close relay","Liberar relé":"Release relay","Parámetros del lector":"Reader parameters","RF Power":"RF Power","Ban ":"Put a tag on and press Analyze.","Peligroso":"Dangerous","Zona peligrosa":"Danger zone","A · Bloquear tag (block lock Gen2, cmd 0x05)":"A · Lock tag (Gen2 block lock, cmd 0x05)","Datos del lock (4 bytes):":"Lock data (4 bytes):","Bloquear (irreversible)":"Lock (irreversible)","B · Comando crudo (CFHid_SendCommand)":"B · Raw command (CFHid_SendCommand)","Comando:":"Command:","Datos (hex):":"Data (hex):","Enviar comando crudo":"Send raw command","C · CryptWrite (experimental)":"C · CryptWrite (experimental)","Comandos conocidos del lector RU5600":"Known commands of the RU5600 reader","Lista blanca":"Whitelist","entradas":"entries","Actualizar":"Refresh","Borrar todas":"Delete all","Borrar":"Delete","Agregar":"Add","Agregar (32 bytes hex)":"Add (32 hex bytes)","Importar (una por línea)":"Import (one per line)","Importar":"Import","Escribir el mismo EPC en un lote":"Write the same EPC to a batch","Total":"Total","Verificar tras escribir":"Verify after writing","Iniciar":"Start","Tag":"Tag","Resultado":"Result","Entiendo el riesgo":"I understand the risk","0x01 inventario   0x02 leer memoria   0x03 escribir memoria   0x04 escribir EPC   0x05 lock   0x10 informacion   0x20/0x21 parametro   0x23/0x24 un parametro   0x3E/0x3F frecuencia   0x30 reiniciar   0x40/0x41 start/stop read   0x85/0x86 relay   0xE0 modulo   0xE1 antena   0xE8-0xEC whitelist   0x2E/0x2F CryptWrite\nBLOQUEADOS: 0x2B/0x2C/0x2D (actualizan el firmware del lector) y 0x65 (Kill6C, mata un tag).":{"en":"0x01 inventory   0x02 read memory   0x03 write memory   0x04 write EPC   0x05 lock   0x10 info   0x20/0x21 parameter   0x23/0x24 one parameter   0x3E/0x3F frequency   0x30 reboot   0x40/0x41 start/stop read   0x85/0x86 relay   0xE0 module   0xE1 antenna   0xE8-0xEC whitelist   0x2E/0x2F CryptWrite\nBLOCKED: 0x2B/0x2C/0x2D (update the reader firmware) and 0x65 (Kill6C, kills a tag)."},"BLOQUEADOS: 0x2B/0x2C/0x2D (firmware) y 0x65 (Kill6C, mata un tag).":{"en":"BLOCKED: 0x2B/0x2C/0x2D (firmware) and 0x65 (Kill6C, kills a tag)."},"Un mal bloqueo deja el tag inservible para siempre y un comando crudo puede dejar el lector en un estado inconsistente.":"A bad lock bricks the tag forever and a raw command can leave the reader in a bad state.","0x2F con payload [mode][0x55][pass]. Este firmware (7.1) no responde a 0x2E/0x2F: área en desarrollo.":"0x2F with payload [mode][0x55][pass]. This firmware (7.1) does not answer 0x2E/0x2F: development area."};
let LANG = 'es';
function t(s){ return (LANG==='en' && STR[s] !== undefined) ? STR[s] : s; }
function applyLang(l){
  LANG = l;
  try{localStorage.setItem('ru5600_lang',l);}catch(e){}
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  var nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    if(!n.nodeValue || !n.nodeValue.trim()) return;
    var p=n.parentElement;
    if(p && (p.tagName==='SCRIPT'||p.tagName==='STYLE')) return;
    if(n._orig===undefined) n._orig=n.nodeValue;
    var o=n._orig, k=o.trim();
    if(l==='en' && STR[k]!==undefined){ n.nodeValue=o.replace(k,STR[k]); }
    else n.nodeValue=o;
  });
  document.querySelectorAll('input[placeholder]').forEach(function(el){
    if(el._ph===undefined) el._ph=el.getAttribute('placeholder')||'';
    el.setAttribute('placeholder', l==='en' ? (STR[el._ph]||el._ph) : el._ph);
  });
  document.documentElement.lang = l;
  var swL = document.getElementById('langSwitch');
  if (swL) swL.checked = (l === 'en');
  document.querySelectorAll('[data-lang-side]').forEach(function (el) {
    var on = el.getAttribute('data-lang-side') === l;
    el.classList.toggle('font-semibold', on);
    el.classList.toggle('opacity-50', !on);
  });
}
const HELP = {"/conexion":{"title":["Ayuda · Conexión","Help · Connection"],"items":[{"t":["Transporte y campos","Transport and fields"],"d":["Cada transporte habilita solo lo suyo. USB: el lector por cable. COM: puerto serie (incluye baudrate). NET: IP y puerto de red. Los campos que no van quedan deshabilitados.","Each transport enables only its own fields. USB: the cabled reader. COM: serial port (baud rate included). NET: network IP and port. Fields that do not apply stay disabled."]},{"t":["Transporte","Transport"],"d":["USB usa el cable directo. COM usa el puerto serie del lector. Net usa la red (necesita IP y puerto).","USB uses the direct cable. COM uses the reader serial port. Net uses the network (needs IP and port)."]},{"t":["Puerto","Port"],"d":["Lista de lectores encontrados en USB o COM. Si está vacía, apretá Escanear puerto.","Readers found on USB or COM. If it is empty, press Scan port."]},{"t":["Baudrate","Baud rate"],"d":["Velocidad del puerto serie. El RU5600 trabaja a 115200 bps.","Serial port speed. The RU5600 works at 115200 bps."]},{"t":["IP de red y Puerto de red","Network IP and port"],"d":["Dirección y puerto del lector cuando se conecta por red. El puerto de fábrica es 60000.","Reader address and port when connecting over the network. The factory port is 60000."]},{"t":["Modo de lectura","Read mode"],"d":["Cómo reparte el tiempo el lector. Ráfaga lee lo más rápido posible; Balanceado es el punto medio; Confiable espera y repite más para no perder tags.","How the reader spends its time. Burst reads as fast as possible; Balanced is the middle ground; Reliable waits and repeats more so no tag is missed."]},{"t":["Abrir / Cerrar","Open / Close"],"d":["Abre la conexión con el transporte elegido y libera el lector al cerrar.","Opens the connection with the chosen transport and releases the reader when closing."]},{"t":["Escanear puerto / Escanear red","Scan port / Scan network"],"d":["Buscan lectores conectados y llenan la lista de Puerto.","Look for connected readers and fill the Port list."]},{"t":["TCPServer","TCPServer"],"d":["Deja el programa escuchando para que otro equipo se conecte al lector.","Leaves the program listening so another machine can connect to the reader."]},{"t":["Instalar regla de acceso USB","Install USB access rule"],"d":["Crea la regla de Linux para abrir el lector sin permisos de administrador.","Creates the Linux rule so the reader can be opened without administrator rights."]},{"t":["Dispositivo","Device"],"d":["Número de serie, firmware y hardware del lector conectado.","Serial number, firmware and hardware of the connected reader."]},{"t":["Exportar / Importar config","Export / Import config"],"d":["Guardan y restauran la configuración del lector en un archivo.","Save and restore the reader settings in a file."]},{"t":["Cerrar / Liberar relé","Close / Release relay"],"d":["Conmutan el relé del lector: un contacto externo que abre o cierra un circuito.","Toggle the reader relay: an external contact that opens or closes a circuit."]}]},"/parametros":{"title":["Ayuda · Parámetros","Help · Parameters"],"items":[{"t":["RF Power","RF Power"],"d":["Potencia de emisión, de 0 a 30 dBm. Más potencia da más alcance y calienta más; 30 dBm es el máximo del lector.","Transmit power, 0 to 30 dBm. More power gives more range and more heat; 30 dBm is the reader maximum."]},{"t":["Banda","Band"],"d":["Plan de frecuencias según el país. Elegí la región donde realmente vas a usar el lector.","Frequency plan for each country. Pick the region where you will actually use the reader."]},{"t":["WorkMode","WorkMode"],"d":["AnswerMode: el lector responde solo cuando el programa se lo pide (menos consumo). ActiveMode: emite y reporta tags por su cuenta, para lectura continua.","AnswerMode: the reader answers only when the program asks (less power draw). ActiveMode: it transmits and reports tags on its own, for continuous reading."]},{"t":["FilterTime(s)","FilterTime(s)"],"d":["Segundos durante los cuales el mismo tag no se vuelve a reportar.","Seconds during which the same tag is not reported again."]},{"t":["Buzzer","Buzzer"],"d":["Pitido del lector en cada lectura. Silenciar ya lo apaga al instante.","Reader beep on every read. Silence now turns it off immediately."]},{"t":["Leer / Aplicar / Defecto","Read / Apply / Default"],"d":["Obtener trae los valores actuales del lector, Aplicar los graba y verifica releyendo, Defecto vuelve a los de fábrica.","Read brings the current reader values, Apply writes them, Default goes back to factory values."]},{"t":["Lectura por defecto","Default reading"],"d":["Lo que usan Leer/Escribir y Barrido cuando no indicás otra cosa: banco, palabra inicial, cantidad de palabras y tiempo de lectura.","What Read/Write and Sweep use unless you say otherwise: bank, first word, word count and read time."]},{"t":["Salida teclado","Keyboard output"],"d":["Solo app de escritorio: el lector escribe el EPC como si fuera un teclado. Formato elige cómo se muestra y Fin de lectura agrega Enter al final.","Desktop app only: the reader types the EPC like a keyboard. Format picks the shape and End of read adds Enter at the end."]}]},"/leer":{"title":["Ayuda · Leer/Escribir","Help · Read/Write"],"items":[{"t":["Leer memoria del tag","Read tag memory"],"d":["Trae el contenido de un banco del tag que esté sobre la antena. EPC es el identificador, TID es el chip y no se puede cambiar, USER son datos propios, RESERVED guarda contraseñas.","Brings the content of one tag bank from the tag on the antenna. EPC is the identifier, TID is the chip and cannot change, USER holds your own data, RESERVED keeps passwords."]},{"t":["Inicio (hex) y Longitud (hex)","Start (hex) and Length (hex)"],"d":["Desde qué palabra empezar y cuántas leer. Una palabra son 2 bytes.","Which word to start at and how many to read. One word is 2 bytes."]},{"t":["Contraseña de acceso","Access password"],"d":["8 dígitos hexadecimales. Si el tag tiene contraseña, sin ella no se puede leer ni escribir.","8 hexadecimal digits. If the tag has a password, nothing can be read or written without it."]},{"t":["Escribir memoria (verificada)","Write memory (verified)"],"d":["Graba las palabras en el banco elegido y después relee para confirmar que quedaron igual.","Writes the words into the chosen bank and reads them back to confirm they match."]},{"t":["Verificar huella antes de escribir","Verify fingerprint before writing"],"d":["Compara el TID con la huella guardada y, si no coincide, no escribe. Evita escribir en el tag equivocado.","Compares the TID with the saved fingerprint and refuses to write when it does not match. Prevents writing to the wrong tag."]},{"t":["Escribir EPC","Write EPC"],"d":["Cambia el identificador del tag: 24 caracteres hex (12 bytes). Se verifica releyéndolo.","Changes the tag identifier: 24 hex characters (12 bytes). Verified by reading it back."]},{"t":["Huella (anti-clonado)","Fingerprint (anti-clone)"],"d":["Aprende el TID del tag actual y después lo verifica. Un clon puede copiar el EPC, pero no el TID.","Learns the current tag TID and verifies it later. A clone can copy the EPC, but not the TID."]}]},"/activa":{"title":["Ayuda · Lectura continua","Help · Continuous reading"],"items":[{"t":["Iniciar / Parar","Start / Stop"],"d":["Arranca y corta la lectura continua. Cada tag aparece apenas el lector lo reporta.","Starts and stops continuous reading. Every tag shows up as soon as the reader reports it."]},{"t":["Veces","Times"],"d":["Cuántas veces se releyó el mismo tag. No crea filas nuevas, suma en esta columna.","How many times the same tag was read again. No new rows, it adds up here."]},{"t":["RSSI","RSSI"],"d":["Fuerza de la señal recibida. Más cerca de 0 es mejor: el tag está cerca de la antena.","Received signal strength. Closer to 0 is better: the tag is near the antenna."]},{"t":["Medir antena","Measure antenna"],"d":["Hace una prueba corta: cuenta lecturas y muestra la última para saber si la antena responde.","Runs ]}]},"/blanca":{"title":["Ayuda · Lista blanca","Help · Whitelist"],"items":[{"t":["Lista blanca","Whitelist"],"d":["EPC que el lector acepta. Un tag que no está en la lista se ignora.","EPCs the reader accepts. A tag that is not on the list is ignored."]},{"t":["Agregar / Importar","Add / Import"],"d":["Agregar carga un EPC escrito en hex. Importar toma una lista, un EPC por línea.","Add stores one EPC written in hex. Import takes a list, one EPC per line."]},{"t":["Borrar","Delete"],"d":["Borra una entrada, o todas con Borrar todas. Después hay que Actualizar para ver el cambio.","Removes one entry, or all with Delete all. Press Refresh afterwards to see the change."]}]},"/lote":{"title":["Ayuda · Lote","Help · Batch"],"items":[{"t":["EPC inicial","Starting EPC"],"d":["El EPC del primer tag del lote, en hex (24 caracteres = 12 bytes).","The EPC of the first tag in the batch, in hex (24 characters = 12 bytes)."]},{"t":["Incremento","Step"],"d":["Lo que se le suma al EPC por cada tag. Con 1 los EPC salen correlativos.","What is added to the EPC for each tag. With 1 the EPCs come out consecutive."]},{"t":["Cantidad de tags","Number of tags"],"d":["Cuántos tags se van a escribir. Podés cortar antes con Parar.","How many tags will be written. You can cut it short with Stop."]},{"t":["Verificar tras escribir","Verify after writing"],"d":["Relee cada tag y compara con el EPC que le tocaba. Si no coincide, la fila lo marca.","Reads each tag back and compares it with the EPC it was assigned. If it does not match, the row says so."]},{"t":["Bloquear tras escribir","Lock after writing"],"d":["Bloquea cada tag al terminar. Es irreversible: mejor hacerlo aparte, en Peligroso.","Locks every tag when done. Irreversible: better to do it separately, in Dangerous."]}]},"/barrido":{"title":["Ayuda · Barrido","Help · Sweep"],"items":[{"t":["Segundos (0 = hasta parar)","Seconds (0 = until stop)"],"d":["Cuánto tiempo leer. Con 0 sigue hasta que aprietes Parar.","How long to read. With 0 it keeps going until you press Stop."]},{"t":["#","#"],"d":["Número de tag encontrado en este barrido, en el orden en que apareció.","Number of the tag found in this sweep, in the order it appeared."]},{"t":["EPC","EPC"],"d":["Identificador del tag. Apoyá el cursor encima para ver la trama cruda completa.","Tag identifier. Hover it to see the full raw frame."]},{"t":["Chip","Chip"],"d":["Modelo de chip deducido de la lectura (por ejemplo H9, Monza, UCODE). Si el chip no está registrado, queda pendiente.","Chip model inferred from the reading (for example H9, Monza, UCODE). If the chip is not registered, it stays pending."]},{"t":["Code W34","Code W34"],"d":["Código corto del tag: los caracteres 7 al 14 del EPC.","Short tag code: characters 7 to 14 of the EPC."]},{"t":["Excel","Excel"],"d":["Si ese EPC aparece en la base de Alejandría. Es la tercera fuente, después del chip y del patrón.","Whether that EPC appears in the Alejandría base. Third source, after the chip and the pattern."]},{"t":["Estado","State"],"d":["Cómo se confirmó el chip: lectura directa, patrón de EPC conocido o coincidencia con la base.","How the chip was confirmed: direct reading, known EPC pattern or a match in the base."]}]}};
function openHelp() {
  var h = HELP[location.pathname] || null;
  var box = document.getElementById('helpBody');
  document.getElementById('helpTitle').textContent = h ? (LANG === 'en' ? h.title[1] : h.title[0]) : (LANG === 'en' ? 'Help' : 'Ayuda');
  box.innerHTML = '';
  var items = h ? h.items : [];
  if (!items.length) {
    var p = document.createElement('p');
    p.className = 'opacity-70';
    p.textContent = LANG === 'en' ? 'This screen has no help yet.' : 'Esta pantalla todavia no tiene ayuda.';
    box.appendChild(p);
  }
  items.forEach(function (it) {
    var wrap = document.createElement('div');
    wrap.className = 'help-item';
    var t = document.createElement('div');
    t.className = 'font-semibold';
    t.textContent = LANG === 'en' ? it.t[1] : it.t[0];
    var d = document.createElement('div');
    d.className = 'opacity-75';
    d.textContent = LANG === 'en' ? it.d[1] : it.d[0];
    wrap.appendChild(t); wrap.appendChild(d); box.appendChild(wrap);
  });
  document.getElementById('helpModal').showModal();
}
document.getElementById('helpTopBtn').onclick = openHelp;
document.addEventListener('keydown', function (e) {
  if (e.key === 'F1') { e.preventDefault(); e.stopPropagation(); openHelp(); }
}, true);
async function downloadExport(path, payload) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
  if (!r.ok) { alert('No se pudo exportar'); return; }
  const blob = await r.blob();
  const cd = r.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename="?([^";]+)"?/);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = m ? m[1] : (payload.name || 'export');
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}
function exportTable(sel, name) {
  const tb = document.querySelector(sel);
  if (!tb) return;
  const headers = [...tb.querySelectorAll('thead th')].map(th => th.textContent.trim()).filter(Boolean);
  const rows = [...tb.querySelectorAll('tbody tr')].map(tr => [...tr.children].map(td => td.textContent.trim()))
    .filter(r => r.some(v => v));
  if (!rows.length) { alert('No hay filas para exportar todavía'); return; }
  downloadExport('/api/export/xlsx', {name: name, headers: headers, rows: rows});
}
function exportText(sel, name) {
  const el = document.querySelector(sel);
  if (!el) return;
  const txt = (el.value !== undefined && el.value !== null && el.value !== '') ? el.value : el.textContent;
  if (!txt || !txt.trim() || txt.trim() === '-') { alert('No hay texto para exportar todavía'); return; }
  downloadExport('/api/export/txt', {name: name, text: txt});
}
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  return r.json();
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('ru5600_theme', t); } catch (e) {}
  document.querySelectorAll('input[name=theme]').forEach(function(el){ el.checked = (el.value === t); });
  var sw = document.getElementById('themeSwitch');
  if (sw) sw.checked = (t === 'dark');
  document.querySelectorAll('[data-theme-side]').forEach(function (el) {
    var on = el.getAttribute('data-theme-side') === t;
    el.classList.toggle('font-semibold', on);
    el.classList.toggle('opacity-50', !on);
  });
}
document.getElementById('themeSwitch').onchange = function () {
  setTheme(this.checked ? 'dark' : 'light');
};
document.querySelectorAll('input[name=lang]').forEach(function(el){ el.onchange = function(){ if(el.checked) applyLang(el.value); }; });
document.getElementById('langSwitch').onchange = function () { applyLang(this.checked ? 'en' : 'es'); };
try{ var _th=localStorage.getItem('ru5600_theme')||'light'; setTheme(_th); }catch(e){}
try{ var _l=localStorage.getItem('ru5600_lang')||'es'; var _r=document.querySelector('input[name=lang][value="'+_l+'"]'); if(_r)_r.checked=true; applyLang(_l);}catch(e){applyLang('es');}
</script>
