<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RU5600 · {% block title %}{% endblock %}</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script>if (window.tailwind) tailwind.config = { darkMode: 'class' }</script>
<link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
<nav class="bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700">
  <div class="max-w-screen-xl flex items-center justify-between mx-auto p-4">
    <span class="text-xl font-semibold">RU5600 Reader</span>
    <button id="themeBtn" class="text-sm text-gray-600 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-1">Claro / Oscuro</button>
  </div>
</nav>
<div class="max-w-screen-xl mx-auto p-4">
  <div class="flex flex-wrap gap-2 mb-4 text-sm">
    <a href="/conexion" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Conexión</a>
    <a href="/parametros" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Parámetros</a>
    <a href="/leer" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Leer/Escribir</a>
    <a href="/activa" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Lectura continua</a>
    <a href="/avanzado" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Avanzado</a>
    <a href="/chip" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Chip info</a>
    <a href="/riesgo" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Peligroso</a>
    <a href="/blanca" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Lista blanca</a>
    <a href="/lote" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Lote</a>
    <a href="/" class="px-3 py-1 rounded-lg border border-gray-300 dark:border-gray-600">Barrido</a>
  </div>
  {% block content %}{% endblock %}
</div>
<script>
document.getElementById('themeBtn').onclick = () => document.documentElement.classList.toggle('dark');
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  return r.json();
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
