<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RU5600 · {% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/bundle.css') }}">
</head>
<body class="bg-base-200 text-base-content">
<div class="navbar bg-base-100 shadow">
  <div class="max-w-screen-xl mx-auto flex items-center justify-between w-full px-4">
    <span class="text-xl font-semibold">RU5600 Reader</span>
    <button id="themeBtn" class="btn btn-ghost btn-sm">Claro / Oscuro</button>
  </div>
</div>
<div class="max-w-screen-xl mx-auto p-4">
  <div role="tablist" class="tabs tabs-boxed mb-4" id="mainTabs">
    <a role="tab" class="tab" data-path="/conexion" href="/conexion">Conexión</a>
    <a role="tab" class="tab" data-path="/parametros" href="/parametros">Parámetros</a>
    <a role="tab" class="tab" data-path="/leer" href="/leer">Leer/Escribir</a>
    <a role="tab" class="tab" data-path="/activa" href="/activa">Lectura continua</a>
    <a role="tab" class="tab" data-path="/avanzado" href="/avanzado">Avanzado</a>
    <a role="tab" class="tab" data-path="/chip" href="/chip">Chip info</a>
    <a role="tab" class="tab" data-path="/riesgo" href="/riesgo">Peligroso</a>
    <a role="tab" class="tab" data-path="/blanca" href="/blanca">Lista blanca</a>
    <a role="tab" class="tab" data-path="/lote" href="/lote">Lote</a>
    <a role="tab" class="tab" data-path="/barrido" href="/barrido">Barrido</a>
  </div>
  <script>
  (function(){var p=location.pathname;var el=document.querySelector('#mainTabs a[data-path="'+p+'"]');if(el)el.classList.add('tab-active');})();
  </script>
  {% block content %}{% endblock %}
</div>
<footer class="max-w-screen-xl mx-auto px-4 pb-6 text-sm opacity-70">RU5600 · Linux + Android · REA</footer>
<script>
const STR = {"Conexión":"Connection","Parámetros":"Parameters","Leer/Escribir":"Read/Write","Lectura continua":"Continuous reading","Avanzado":"Advanced","Chip info":"Chip info","Peligroso":"Dangerous","Lista blanca":"Whitelist","Lote":"Batch","Barrido":"Sweep","Claro / Oscuro":"Light / Dark","RU5600 · Linux + Android · REA":"RU5600 · Linux + Android · REA","Idioma y apariencia":"Language and theme","Idioma":"Language","Tema":"Theme","Oscuro":"Dark","Claro":"Light","Transporte":"Transport","Velocidad":"Baud rate","Puerto":"Port","Modo de lectura":"Read mode","Ráfaga (rápido)":"Burst (fast)","Balanceado":"Balanced","Confiable":"Reliable","IP de red":"Network IP","Puerto de red":"Network port","Abrir":"Open","Cerrar":"Close","Escanear puerto":"Scan port","Escanear red":"Scan network","TCPServer":"TCPServer","Ayuda":"Help","Instalar regla de acceso USB":"Install USB access rule","Dispositivo":"Device","N. de serie":"Serial number","Firmware":"Firmware","Hardware":"Hardware","Exportar config":"Export config","Importar config":"Import config","Cerrar relé":"Close relay","Liberar relé":"Release relay","Parámetros del lector":"Reader parameters","RF Power":"RF Power","Banda":"Band","WorkMode":"Work mode","AnswerMode":"Answer mode","ActiveMode":"Active mode","FilterTime(s):":"FilterTime(s):","Buzzer":"Buzzer","Leer":"Read","Aplicar":"Apply","Defecto":"Default","Silenciar ya":"Silence now","Lectura por defecto (para Leer/Escribir)":"Default reading (for Read/Write)","Área":"Area","Inicio (hex)":"Start (hex)","Longitud (hex)":"Length (hex)","ReadTime":"ReadTime","Salida teclado (cuña: solo app de escritorio)":"Keyboard wedge (desktop app only)","Formato":"Format","OutWithEnterKey":"OutWithEnterKey","Leer memoria del tag":"Read tag memory","Banco:":"Bank:","Dirección (hex):":"Address (hex):","Contraseña de acceso:":"Access password:","Escribir memoria (verificada)":"Write memory (verified)","Escribir":"Write","Verificar huella antes de escribir":"Verify fingerprint before writing","Escribir EPC":"Write EPC","EPC (hex):":"EPC (hex):","Huella (anti-clonado)":"Fingerprint (anti-clone)","Aprender huella del tag actual":"Learn current tag fingerprint","Verificar huella":"Verify fingerprint","Iniciar lectura":"Start reading","Parar":"Stop","Detenido.":"Stopped.","Segundos (0 = hasta parar)":"Seconds (0 = until stop)","EPC":"EPC","Chip":"Chip","Code W34":"W34 code","Excel":"Excel","Estado":"State","Crudo íntegro por tag (tooltip en EPC). Deduplicado por blob: la relectura no crea fila nueva.":"Full raw record per tag (tooltip on EPC). Deduped by blob: re-reads create no new row.","Crudo + chip-primero como en Barrido. La relectura suma veces, no filas.":"Raw + chip-first as in Barrido. Re-reads add up, no new rows.","Ant":"Ant","Veces":"Times","Última vez":"Last seen","Crudo":"Raw","TID":"TID","RSSI":"RSSI","Avanzado":"Advanced","Frecuencia":"Frequency","Grabar banda":"Write band","Reiniciar lector":"Reboot reader","frec. cruda: -":"raw freq: -","Analizar chip":"Analyze chip","Contraseña de acceso":"Access password","Probar contraseña":"Test password","Barrido profundo (mapa de memoria)":"Deep scan (memory map)","Poné un tag y apretá Analizar.":"Put a tag on and press Analyze.","Peligroso":"Dangerous","Zona peligrosa":"Danger zone","A · Bloquear tag (block lock Gen2, cmd 0x05)":"A · Lock tag (Gen2 block lock, cmd 0x05)","Datos del lock (4 bytes):":"Lock data (4 bytes):","Bloquear (irreversible)":"Lock (irreversible)","B · Comando crudo (CFHid_SendCommand)":"B · Raw command (CFHid_SendCommand)","Comando:":"Command:","Datos (hex):":"Data (hex):","Enviar comando crudo":"Send raw command","C · CryptWrite (experimental)":"C · CryptWrite (experimental)","Comandos conocidos del lector RU5600":"Known commands of the RU5600 reader","Lista blanca":"Whitelist","entradas":"entries","Actualizar":"Refresh","Borrar todas":"Delete all","Borrar":"Delete","Agregar":"Add","Agregar (32 bytes hex)":"Add (32 hex bytes)","Importar (una por línea)":"Import (one per line)","Importar":"Import","Escribir el mismo EPC en un lote":"Write the same EPC to a batch","Total":"Total","Verificar tras escribir":"Verify after writing","Iniciar":"Start","Tag":"Tag","Resultado":"Result","Entiendo el riesgo":"I understand the risk","0x01 inventario   0x02 leer memoria   0x03 escribir memoria   0x04 escribir EPC   0x05 lock   0x10 informacion   0x20/0x21 parametro   0x23/0x24 un parametro   0x3E/0x3F frecuencia   0x30 reiniciar   0x40/0x41 start/stop read   0x85/0x86 relay   0xE0 modulo   0xE1 antena   0xE8-0xEC whitelist   0x2E/0x2F CryptWrite\nBLOQUEADOS: 0x2B/0x2C/0x2D (actualizan el firmware del lector) y 0x65 (Kill6C, mata un tag).":{"en":"0x01 inventory   0x02 read memory   0x03 write memory   0x04 write EPC   0x05 lock   0x10 info   0x20/0x21 parameter   0x23/0x24 one parameter   0x3E/0x3F frequency   0x30 reboot   0x40/0x41 start/stop read   0x85/0x86 relay   0xE0 module   0xE1 antenna   0xE8-0xEC whitelist   0x2E/0x2F CryptWrite\nBLOCKED: 0x2B/0x2C/0x2D (update the reader firmware) and 0x65 (Kill6C, kills a tag)."},"BLOQUEADOS: 0x2B/0x2C/0x2D (firmware) y 0x65 (Kill6C, mata un tag).":{"en":"BLOCKED: 0x2B/0x2C/0x2D (firmware) and 0x65 (Kill6C, kills a tag)."},"Un mal bloqueo deja el tag inservible para siempre y un comando crudo puede dejar el lector en un estado inconsistente.":"A bad lock bricks the tag forever and a raw command can leave the reader in a bad state.","0x2F con payload [mode][0x55][pass]. Este firmware (7.1) no responde a 0x2E/0x2F: área en desarrollo.":"0x2F with payload [mode][0x55][pass]. This firmware (7.1) does not answer 0x2E/0x2F: development area."};
let LANG = 'es';
function t(s){ return (LANG==='en' && STR[s] !== undefined) ? STR[s] : s; }
function applyLang(l){
  LANG = l;
  try{localStorage.setItem('ru5600_lang',l);}catch(e){}
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  var nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    if(!n.nodeValue || !n.nodeValue.trim()) return;
    var p=n.parentElement;
    if(p && (p.tagName==='SCRIPT'||p.tagName==='STYLE')) return;
    if(n._orig===undefined) n._orig=n.nodeValue;
    var o=n._orig, k=o.trim();
    if(l==='en' && STR[k]!==undefined){ n.nodeValue=o.replace(k,STR[k]); }
    else n.nodeValue=o;
  });
  document.querySelectorAll('input[placeholder]').forEach(function(el){
    if(el._ph===undefined) el._ph=el.getAttribute('placeholder')||'';
    el.setAttribute('placeholder', l==='en' ? (STR[el._ph]||el._ph) : el._ph);
  });
  document.documentElement.lang = l;
}
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  return r.json();
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('input[name=theme]').forEach(function(el){ el.checked = (el.value === t); });
}
document.getElementById('themeBtn').onclick = () => {
  setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
};
document.querySelectorAll('input[name=lang]').forEach(function(el){ el.onchange = function(){ if(el.checked) applyLang(el.value); }; });
try{ var _l=localStorage.getItem('ru5600_lang')||'es'; var _r=document.querySelector('input[name=lang][value="'+_l+'"]'); if(_r)_r.checked=true; applyLang(_l);}catch(e){applyLang('es');}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
