<script>
/* Almacenamiento con respaldo: pywebview/GTK trae HTML5 local storage
   DESACTIVADO (enable_html5_local_storage=False en su backend) -> la
   variable localStorage ni existe y cada acceso revienta el script que
   sigue (asi murieron pread() en Parametros y los defaults de Leer).
   storeGet/storeSet usan localStorage si hay, si no cookies del mismo
   origen, y si no memoria de la pagina. Nunca tiran. */
var __memStore = {};
function storeGet(k) {
  try {
    if (window.localStorage) {
      var v = window.localStorage.getItem(k);
      if (v !== null && v !== undefined) return v;
    }
  } catch (e) {}
  try {
    var m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)'));
    if (m) return decodeURIComponent(m[1]);
  } catch (e) {}
  return (k in __memStore) ? __memStore[k] : null;
}
function storeSet(k, v) {
  v = String(v);
  try { if (window.localStorage) { window.localStorage.setItem(k, v); return; } } catch (e) {}
  try { document.cookie = k + '=' + encodeURIComponent(v) + ';path=/;max-age=31536000'; return; } catch (e) {}
  __memStore[k] = v;
}
try { var _tt = storeGet('ru5600_theme'); if (_tt === 'dark' || _tt === 'light') { document.documentElement.dataset.theme = _tt; } } catch (e) {}
</script>
<script>
// Reporte de errores JS hacia el log de la app: la ventana nativa (pywebview)
// no tiene consola visible; sin esto somos ciegos ante lo que falla ahi.
// Va PRIMERO para atrapar errores de todos los scripts que siguen.
// (capado a 20 reportes por pagina para no inundar el log si algo explota)
try {
  window.__errCount = 0;
  window.__trace = function (m) {
    try {
      fetch('/api/js_error', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({msg: 'trace: ' + String(m), src: '', line: 0})}).catch(function(){});
    } catch (e) {}
  };
  window.addEventListener('error', function (ev) {
    try {
      if (window.__errCount >= 20) return;
      window.__errCount++;
      fetch('/api/js_error', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({msg: String(ev.message || ev.error || 'error'),
          src: String(ev.filename || ''), line: ev.lineno || 0})}).catch(function(){});
    } catch (e) {}
  });
  window.addEventListener('unhandledrejection', function (ev) {
    try {
      if (window.__errCount >= 20) return;
      window.__errCount++;
      fetch('/api/js_error', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({msg: 'promise: ' + String((ev.reason && ev.reason.message) || ev.reason),
          src: '', line: 0})}).catch(function(){});
    } catch (e) {}
  });
} catch (e) {}
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/bundle.css') }}">
<style>
/* Tablas: encabezados firmes y opacos dentro de contenedores con scroll vertical.
   Sin esto las filas pasan por encima de los títulos (Pruebas: Tags guardados y log).
   El fondo sale de la variable del tema, así sigue funcionando en claro/oscuro. */
.overflow-y-auto thead th,
thead.sticky th {
  position: sticky;
  top: 0;
  z-index: 2;
  background-color: var(--color-base-100, Canvas);
  box-shadow: inset 0 -1px 0 0 color-mix(in oklab, currentColor 22%, transparent);
}
.overflow-y-auto thead,
thead.sticky {
  opacity: 1; /* anula opacity-70: el texto del título queda sólido */
}

/* Pestañas internas (Pruebas): la barra lleva el fondo de las sections
   (base-100) y la activa se marca en base-200 para que se diferencie. */
/* El fondo gris llega hasta el final del viewport: DaisyUI pinta el html
   (root) con base-100 (blanco en claro) y eso deja una franja blanca cuando
   el contenido es mas corto que la ventana. Se iguala el root al base-200
   (vale en claro y oscuro) y el body ocupa como minimo toda la altura. */
html { background-color: var(--color-base-200, Canvas); }
body { min-height: 100vh; }
/* Los popups NATIVOS (opciones del <select>, scrollbars) los dibuja WebKit/GTK,
   no nuestra CSS: sin color-scheme salen con el estilo del sistema (oscuro)
   aunque la pagina este en claro. Se declara por tema y vale en todas las
   vistas (base.html es padre de todas). */
html[data-theme="light"] { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
/* Dropdowns propios: reemplazan el popup NATIVO del <select> (lo dibuja
   WebKit/GTK como menu del sistema: con grab y con el tema GTK, fuera de
   nuestro alcance). Todo pintado con variables del tema -> respeta
   claro/oscuro en todas las vistas. El select original se esconde pero
   CONSERVA id/value/disabled: el codigo que lee .value no cambia. */
.cselect { position: relative; display: inline-block; vertical-align: middle; }
.cselect > select { display: none !important; }
.cselect-btn { cursor: pointer; text-align: left; }
.cselect-btn .cselect-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cselect-btn:disabled { cursor: not-allowed; opacity: .55; }
.cselect-menu {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60;
  background-color: var(--color-base-100, Canvas);
  border: 1px solid var(--color-base-300, GrayText);
  border-radius: var(--radius-box, 0.5rem);
  box-shadow: 0 8px 24px rgb(0 0 0 / .18);
  padding: 4px; margin: 0;
  max-height: 240px; overflow-y: auto;
}
.cselect-menu[hidden] { display: none; }
.cselect-item {
  display: block; width: 100%; text-align: left;
  padding: 6px 10px; border-radius: 6px; font-size: inherit; color: inherit;
  background: transparent; border: 0; cursor: pointer; white-space: nowrap;
}
.cselect-item:hover { background-color: var(--color-base-200, ButtonFace); }
.cselect-item[aria-selected="true"] {
  background-color: var(--color-base-200, ButtonFace); font-weight: 600;
}
.tabs-card { background-color: var(--color-base-100, Canvas); }
.tabs-card .tab-active {
  background-color: var(--color-base-200, Canvas);
  font-weight: 600;
}
</style>

he other columns are ignored.","Descargar plantilla":"Download template","Planilla (.xlsx o .csv)":"Sheet (.xlsx or .csv)","EPC actual":"Current EPC","EPC nuevo":"New EPC","Iniciar cambio":"Start change","Veces = cuántas veces se releyó ese tag (no crea filas nuevas). Ant = antena que lo leyó. RSSI = fuerza de la señal: cuanto más cerca de 0, mejor. Crudo = la trama tal como llega del lector.":"Times = how many times that tag was read again (no new rows). Ant = antenna that read it. RSSI = signal strength: closer to 0 is better. Raw = the frame exactly as it arrives from the reader.","Frecuencia cruda es el valor interno que reporta el lector; no está en MHz ni es un canal. Sirve como referencia: leela antes y después de grabar la banda, y si cambia, la grabación se aplicó.":"Raw frequency is the internal value the reader reports; it is not in MHz and not a channel. Use it as a reference: read it before and after writing the band, and if it changes, the write was applied.","Servidor TCP":"TCP server","Escribir EPC secuenciales por lote":"Write sequential EPCs by batch","Cada tag que aparece recibe el siguiente EPC de la serie. El primero es el EPC inicial; después se le suma el incremento por cada tag.":"Every tag that shows up gets the next EPC in the series. The first one is the starting EPC; after that the step is added for each tag.","EPC inicial (hex)":"Starting EPC (hex)","24 caracteres hex (12 bytes). Es el EPC del primer tag del lote.":"24 hex characters (12 bytes). The EPC of the first tag in the batch.","Incremento (hex)":"Step (hex)","Cuánto se le suma al EPC en cada tag. 1 = correlativo.":"Added to the EPC for each tag. 1 = consecutive.","EPC escrito":"EPC written","Cómo funciona la lista blanca":"How the whitelist works","La lista vive en el lector: guarda los EPC que el lector tiene autorizados. Esta pantalla lee y escribe esa tabla directamente, no una copia local.":"The list lives in the reader: it holds the EPCs the reader is allowed to accept. This screen reads and writes that table directly, not a local copy.","Actualizar trae la lista real del lector: cuántas entradas tiene y cuáles son.":"Refresh brings the real list from the reader: how many entries it holds and which ones.","Agregar suma una entrada escrita en hex, hasta 32 bytes.":"Add stores one entry written in hex, up to 32 bytes.","Importar carga varias de una vez, un EPC por línea.":"Import loads several at once, one EPC per line.","Borrar quita una entrada; Borrar todas vacía la tabla completa.":"Delete removes one entry; Delete all empties the whole table.","Los cambios quedan grabados en el lector y sobreviven a cerrar la aplicación.":"Changes are stored in the reader and survive closing the application.","? Ayuda":"? Help","Exportar/Importar config guardan y restauran los parámetros del lector en un archivo. Cerrar relé y Liberar relé conmutan el contacto del relé del lector.":"Export/Import config save and restore the reader settings in a file. Close relay and Release relay toggle the reader relay contact.","Lee durante el tiempo indicado y suma tags distintos: la relectura del mismo tag no crea fila nueva. Apoyá el cursor en el EPC para ver la trama cruda.":"Reads for the given time and adds distinct tags: re-reading the same tag creates no new row. Hover the EPC to see the raw frame.","Banco":"Bank","Un mal bloqueo deja el tag inservible para siempre, y un comando mal enviado puede dejar el lector sin responder hasta reiniciarlo.":"A bad lock bricks the tag forever, and a badly sent command can leave the reader unresponsive until it is rebooted.","A · Bloquear un tag para siempre":"A · Lock a tag forever","Deja el tag fijo: no se puede volver a escribir ni desbloquear. Usalo solo en tags que ya van a quedar pegados a su producto final. Antes de bloquear, leé el tag en Leer/Escribir y guardá su EPC.":"Makes the tag permanent: it cannot be written or unlocked again. Use it only on tags already fixed to their final product. Before locking, read the tag in Read/Write and save its EPC.","Datos de bloqueo (hex)":"Lock data (hex)","Acción (hex)":"Action (hex)","B · Enviar un comando al lector (soporte)":"B · Send a command to the reader (support)","Herramienta de soporte técnico: manda un comando hexadecimal directo al lector, sin validación. Si no sabés qué número va, no la uses; el catálogo de comandos lo maneja el soporte.":"Technical support tool: sends a raw hexadecimal command straight to the reader, with no validation. If you do not know which number to use, do not use it; support owns the command catalogue.","Comando (hex)":"Command (hex)","Datos (hex)":"Data (hex)","Espera (ms)":"Wait (ms)","C · Escritura cifrada (experimental)":"C · Encrypted write (experimental)","Este lector no responde a la escritura cifrada, así que la función queda visible pero inactiva. No la uses en producción.":"This reader does not answer encrypted writes, so the feature stays visible but inactive. Do not use it in production.","Modo (hex)":"Mode (hex)","Contraseña":"Password","Cómo usar esta sección":"How to use this section","Marcá «Entiendo el riesgo»: recién ahí se habilitan los botones.":"Check 'I understand the risk': only then the buttons become enabled.","Bloqueá solo tags que ya están fijos en su producto final. El bloqueo no tiene deshacer.":"Lock only tags already fixed to their final product. Locking cannot be undone.","Antes de tocar nada, leé el tag en Leer/Escribir y guardá su EPC: es tu único respaldo.":"Before touching anything, read the tag in Read/Write and save its EPC: it is your only backup.","Si el lector deja de responder, reinicialo en Avanzado → Reiniciar lector y volvé a conectar en Conexión.":"If the reader stops answering, reboot it in Advanced → Reboot reader and connect again in Connection.","EPC a escribir":"EPC to write","Cada tag del lote queda con este mismo EPC. 24 caracteres hex.":"Every tag in the batch ends up with this same EPC. 24 hex characters.","Cantidad de tags":"Number of tags", let LANG = 'es';
function t(s){ return (LANG==='en' && STR[s] !== undefined) ? STR[s] : s; }
function applyLang(l){
  LANG = l;
  storeSet('ru5600_lang', l);
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  var nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    if(!n.nodeValue || !n.nodeValue.trim()) return;
    var p=n.parentElement;
    if(p && (p.tagName==='SCRIPT'||p.tagName==='STYLE')) return;
    if(n._orig===undefined) n._orig=n.nodeValue;
    var o=n._orig, k=o.trim();
    if(l==='en' && STR[k]!==undefined){ n.nodeValue=o.replace(k,STR[k]); }
    else n.nodeValue=o;
  });
  document.querySelectorAll('input[placeholder]').forEach(function(el){
    if(el._ph===undefined) el._ph=el.getAttribute('placeholder')||'';
    el.setAttribute('placeholder', l==='en' ? (STR[el._ph]||el._ph) : el._ph);
  });
  document.documentElement.lang = l;
  var swL = document.getElementById('langSwitch');
  if (swL) swL.checked = (l === 'en');
  document.querySelectorAll('[data-lang-side]').forEach(function (el) {
    var on = el.getAttribute('data-lang-side') === l;
    el.classList.toggle('font-semibold', on);
    el.classList.toggle('opacity-50', !on);
  });
}
const HELP = {"/conexion":{"title":["Ayuda · Conexión","Help · Connection"],"items":[{"t":["Transporte y campos","Transport and fields"],"d":["Cada transporte habilita solo lo suyo. USB: el lector por cable. COM: puerto serie (incluye baudrate). NET: IP y puerto de red. Los campos que no van quedan deshabilitados.","Each transport enables only its own fields. USB: the cabled reader. COM: serial port (baud rate included). NET: network IP and port. Fields that do not apply stay disabled."]},{"t":["Transporte","Transport"],"d":["USB usa el cable directo. COM usa el puerto serie del lector. Net usa la red (necesita IP y puerto).","USB uses the direct cable. COM uses the reader serial port. Net uses the network (needs IP and port)."]},{"t":["Puerto","Port"],"d":["Lista de lectores encontrados en USB o COM. Si está vacía, apretá Escanear puerto.","Readers found on USB or COM. If it is empty, press Scan port."]},{"t":["Baudrate","Baud rate"],"d":["Velocidad del puerto serie. El RU5600 trabaja a 115200 bps.","Serial port speed. The RU5600 works at 115200 bps."]},{"t":["IP de red y Puerto de red","Network IP and port"],"d":["Dirección y puerto del lector cuando se conecta por red. El puerto de fábrica es 60000.","Reader address and port when connecting over the network. The factory port is 60000."]},{"t":["Modo de lectura","Read mode"],"d":["Cómo reparte el tiempo el lector. Ráfaga lee lo más rápido posible; Balanceado es el punto medio; Confiable espera y repite más para no perder tags.","How the reader spends its time. Burst reads as fast as possible; Balanced is the middle ground; Reliable waits and repeats more so no tag is missed."]},{"t":["Abrir / Cerrar","Open / Close"],"d":["Abre la conexión con el transporte elegido y libera el lector al cerrar.","Opens the connection with the chosen transport and releases the reader when closing."]},{"t":["Escanear puerto / Escanear red","Scan port / Scan network"],"d":["Buscan lectores conectados y llenan la lista de Puerto.","Look for connected readers and fill the Port list."]},{"t":["TCPServer","TCPServer"],"d":["Deja el programa escuchando para que otro equipo se conecte al lector.","Leaves the program listening so another machine can connect to the reader."]},{"t":["Instalar regla de acceso USB","Install USB access rule"],"d":["Crea la regla de Linux para abrir el lector sin permisos de administrador.","Creates the Linux rule so the reader can be opened without administrator rights."]},{"t":["Dispositivo","Device"],"d":["Número de serie, firmware y hardware del lector conectado.","Serial number, firmware and hardware of the connected reader."]},{"t":["Exportar / Importar config","Export / Import config"],"d":["Guardan y restauran la configuración del lector en un archivo.","Save and restore the reader settings in a file."]},{"t":["Cerrar / Liberar relé","Close / Release relay"],"d":["Conmutan el relé del lector: un contacto externo que abre o cierra un circuito.","Toggle the reader relay: an external contact that opens or closes a circuit."]}]},"/parametros":{"title":["Ayuda · Parámetros","Help · Parameters"],"items":[{"t":["Perfiles de lectura","Reading profiles"],"d":["Elegí un perfil y se cambian juntas las tres cosas que definen cómo lee: el WorkMode del lector (AnswerMode/ActiveMode), la pausa entre lecturas dirigidas (Ráfaga 30 ms, Balanceado 120 ms, Confiable 250 ms con 2 reintentos) y el camino del barrido (stream o dirigido). Perfiles: Inventario rápido (stream a máxima velocidad; medido 10/10 en 24 s) · Uso general (stream con fallback automático a dirigido; el de todos los días) · Lectura dedicada (dirigido forzado, para H10 y UCODE 8/9 y tags de a uno) · Continuo (ActiveMode para Lectura continua y Distancia) · Pausado (el más lento, para escritura y verificación largas). Si cambiás un valor a mano (por ejemplo RF Power para leer de cerca), el perfil pasa a Personalizado y conserva el resto de la configuración; elegir un perfil de la lista lo reemplaza.","Pick a profile and the three things that define how it reads change together: the reader WorkMode (AnswerMode/ActiveMode), the pause between directed reads (Burst 30 ms, Balanced 120 ms, Reliable 250 ms with 2 retries) and the sweep path (stream or directed). Profiles: Fast inventory (fastest stream; measured 10/10 in 24 s) · General use (stream with automatic fallback to directed; the daily one) · Dedicated read (forced directed, for H10 and UCODE 8/9 and single tags) · Continuous (ActiveMode for Continuous reading and Distance) · Paused (the slowest, for long writes and verifications). If you change a value by hand (for example RF Power to read closer), the profile becomes Custom and keeps the rest of the configuration; picking a profile from the list replaces it."]},{"t":["RF Power","RF Power"],"d":["Potencia de emisión, de 0 a 30 dBm. Más potencia da más alcance y calienta más; 30 dBm es el máximo del lector.","Transmit power, 0 to 30 dBm. More power gives more range and more heat; 30 dBm is the reader maximum."]},{"t":["Banda","Band"],"d":["Plan de frecuencias según el país. Elegí la región donde realmente vas a usar el lector.","Frequency plan for each country. Pick the region where you will actually use the reader."]},{"t":["WorkMode","WorkMode"],"d":["AnswerMode: el lector responde solo cuando el programa se lo pide (menos consumo). ActiveMode: emite y reporta tags por su cuenta, para lectura continua.","AnswerMode: the reader answers only when the program asks (less power draw). ActiveMode: it transmits and reports tags on its own, for continuous reading."]},{"t":["FilterTime(s)","FilterTime(s)"],"d":["Segundos durante los cuales el mismo tag no se vuelve a reportar.","Seconds during which the same tag is not reported again."]},{"t":["Buzzer","Buzzer"],"d":["Pitido del lector en cada lectura. Silenciar ya lo apaga al instante.","Reader beep on every read. Silence now turns it off immediately."]},{"t":["Leer / Aplicar / Defecto","Read / Apply / Default"],"d":["Obtener trae los valores actuales del lector, Aplicar los graba y verifica releyendo, Defecto vuelve a los de fábrica.","Read brings the current reader values, Apply writes them, Default goes back to factory values."]},{"t":["Lectura por defecto","Default reading"],"d":["Lo que usan Leer/Escribir y Barrido cuando no indicás otra cosa: banco, palabra inicial, cantidad de palabras y tiempo de lectura.","What Read/Write and Sweep use unless you say otherwise: bank, first word, word count and read time."]},{"t":["Salida teclado","Keyboard output"],"d":["Solo app de escritorio: el lector escribe el EPC como si fuera un teclado. Formato elige cómo se muestra y Fin de lectura agrega Enter al final.","Desktop app only: the reader types the EPC like a keyboard. Format picks the shape and End of read adds Enter at the end."]}]},"/leer":{"title":["Ayuda · Leer/Escribir","Help · Read/Write"],"items":[{"t":["Leer memoria del tag","Read tag memory"],"d":["Trae el contenido de un banco del tag que esté sobre la antena. EPC es el identificador, TID es el chip y no se puede cambiar, USER son datos propios, RESERVED guarda contraseñas.","Brings the content of one tag bank from the tag on the antenna. EPC is the identifier, TID is the chip and cannot change, USER holds your own data, RESERVED keeps passwords."]},{"t":["Inicio (hex) y Longitud (hex)","Start (hex) and Length (hex)"],"d":["Desde qué palabra empezar y cuántas leer. Una palabra son 2 bytes.","Which word to start at and how many to read. One word is 2 bytes."]},{"t":["Contraseña de acceso","Access password"],"d":["8 dígitos hexadecimales. Si el tag tiene contraseña, sin ella no se puede leer ni escribir.","8 hexadecimal digits. If the tag has a password, nothing can be read or written without it."]},{"t":["Escribir memoria (verificada)","Write memory (verified)"],"d":["Graba las palabras en el banco elegido y después relee para confirmar que quedaron igual.","Writes the words into the chosen bank and reads them back to confirm they match."]},{"t":["Verificar huella antes de escribir","Verify fingerprint before writing"],"d":["Compara el TID con la huella guardada y, si no coincide, no escribe. Evita escribir en el tag equivocado.","Compares the TID with the saved fingerprint and refuses to write when it does not match. Prevents writing to the wrong tag."]},{"t":["Escribir EPC","Write EPC"],"d":["Cambia el identificador del tag: 24 caracteres hex (12 bytes). Se verifica releyéndolo.","Changes the tag identifier: 24 hex characters (12 bytes). Verified by reading it back."]},{"t":["Huella (anti-clonado)","Fingerprint (anti-clone)"],"d":["Aprende el TID del tag actual y después lo verifica. Un clon puede copiar el EPC, pero no el TID.","Learns the current tag TID and verifies it later. A clone can copy the EPC, but not the TID."]}]},"/activa":{"title":["Ayuda · Lectura continua","Help · Continuous reading"],"items":[{"t":["Iniciar / Parar","Start / Stop"],"d":["Arranca y corta la lectura continua. Cada tag aparece apenas el lector lo reporta.","Starts and stops continuous reading. Every tag shows up as soon as the reader reports it."]},{"t":["Veces","Times"],"d":["Cuántas veces se releyó el mismo tag. No crea filas nuevas, suma en esta columna.","How many times the same tag was read again. No new rows, it adds up here."]},{"t":["RSSI","RSSI"],"d":["Fuerza de la señal recibida. Más cerca de 0 es mejor: el tag está cerca de la antena.","Received signal strength. Closer to 0 is better: the tag is near the antenna."]},{"t":["Medir antena","Measure antenna"],"d":["Hace una prueba corta: cuenta lecturas y muestra la última para saber si la antena responde.","Runs a short test: counts reads and shows the last one so you know the antenna answers."]},{"t":["Crudo","Raw"],"d":["La trama completa tal como llega del lector, sin interpretar.","The full frame exactly as it arrives from the reader, uninterpreted."]}]},"/chip":{"title":["Ayuda · Chip info","Help · Chip info"],"items":[{"t":["Analizar chip","Analyze chip"],"d":["Lee el tag y deduce el modelo de chip a partir del TID y de la memoria que responde.","Reads the tag and infers the chip model from the TID and the memory that answers."]},{"t":["Probar contraseña","Test password"],"d":["Prueba si la contraseña indicada abre el acceso al tag.","Tests whether the given password opens access to the tag."]},{"t":["Barrido profundo","Deep scan"],"d":["Recorre los bancos de memoria para ver qué está escrito y qué está protegido.","Walks the memory banks to see what is written and what is protected."]}]},"/riesgo":{"title":["Ayuda · Peligroso","Help · Dangerous"],"items":[{"t":["Entiendo el riesgo","I understand the risk"],"d":["Los botones quedan deshabilitados hasta que lo marcás. Es a propósito: nada de esta pantalla se puede deshacer.","The buttons stay disabled until you check it. On purpose: nothing on this screen can be undone."]},{"t":["Bloquear tag","Lock tag"],"d":["Aplica el bloqueo Gen2: el tag queda sin escritura para siempre. Solo para tags ya fijados a su producto final.","Applies the Gen2 lock: the tag loses writing forever. Only for tags already fixed to their final product."]},{"t":["Enviar comando","Send command"],"d":["Herramienta de soporte técnico. No valida nada: si el número no es el correcto, el lector puede quedar sin responder hasta reiniciarlo.","Technical support tool. It validates nothing: with a wrong number the reader may stop answering until rebooted."]},{"t":["Escritura cifrada","Encrypted write"],"d":["Este firmware no responde a la escritura cifrada. Queda visible e inactiva.","This firmware does not answer encrypted writes. Visible but inactive."]}]},"/blanca":{"title":["Ayuda · Lista blanca","Help · Whitelist"],"items":[{"t":["Lista blanca","Whitelist"],"d":["EPC que el lector acepta. Un tag que no está en la lista se ignora.","EPCs the reader accepts. A tag that is not on the list is ignored."]},{"t":["Agregar / Importar","Add / Import"],"d":["Agregar carga un EPC escrito en hex. Importar toma una lista, un EPC por línea.","Add stores one EPC written in hex. Import takes a list, one EPC per line."]},{"t":["Borrar","Delete"],"d":["Borra una entrada, o todas con Borrar todas. Después hay que Actualizar para ver el cambio.","Removes one entry, or all with Delete all. Press Refresh afterwards to see the change."]}]},"/lote":{"title":["Ayuda · Lote","Help · Batch"],"items":[{"t":["EPC inicial","Starting EPC"],"d":["El EPC del primer tag del lote, en hex (24 caracteres = 12 bytes).","The EPC of the first tag in the batch, in hex (24 characters = 12 bytes)."]},{"t":["Incremento","Step"],"d":["Lo que se le suma al EPC por cada tag. Con 1 los EPC salen correlativos.","What is added to the EPC for each tag. With 1 the EPCs come out consecutive."]},{"t":["Cantidad de tags","Number of tags"],"d":["Cuántos tags se van a escribir. Podés cortar antes con Parar.","How many tags will be written. You can cut it short with Stop."]},{"t":["Verificar tras escribir","Verify after writing"],"d":["Relee cada tag y compara con el EPC que le tocaba. Si no coincide, la fila lo marca.","Reads each tag back and compares it with the EPC it was assigned. If it does not match, the row says so."]},{"t":["Bloquear tras escribir","Lock after writing"],"d":["Bloquea cada tag al terminar. Es irreversible: mejor hacerlo aparte, en Peligroso.","Locks every tag when done. Irreversible: better to do it separately, in Dangerous."]}]},"/pruebas":{"title":["Ayuda · Pruebas","Help · Tests"],"items":[{"t":["Para qué sirve","What it is for"],"d":["Diagnóstico con datos en vivo: cada prueba deja una línea en el log con hora, resultado y error. Todo es solo lectura: no escribe en tags.","Live diagnostics: every probe writes a log line with time, result and error. Read-only: nothing is written to tags."]},{"t":["Leer EPC dirigido","Directed EPC read"],"d":["Un solo comando de lectura al tag que está en la antena. Si esto funciona y el inventario no, el problema es del camino de stream, no del tag.","A single read command to the tag on the antenna. If this works and inventory does not, the problem is the stream path, not the tag."]},{"t":["scan / InventoryG2 / StartRead","scan / InventoryG2 / StartRead"],"d":["Los tres caminos posibles para descubrir tags. Se comparan entre sí para ver cuál responde en este equipo.","The three possible paths to discover tags. They are compared to see which one answers on this reader."]},{"t":["Callback","Callback"],"d":["Cuántas veces el SDK nos llamó, con qué mensaje y cuántos bytes trajo. Si nunca llama, el lector no está empujando datos.","How many times the SDK called us, with which message and how many bytes. If it never calls, the reader is not pushing data."]}]},
"/barrido":{"title":["Ayuda · Barrido","Help · Sweep"],"items":[{"t":["Segundos (0 = hasta parar)","Seconds (0 = until stop)"],"d":["Cuánto tiempo leer. Con 0 sigue hasta que aprietes Parar.","How long to read. With 0 it keeps going until you press Stop."]},{"t":["#","#"],"d":["Número de tag encontrado en este barrido, en el orden en que apareció.","Number of the tag found in this sweep, in the order it appeared."]},{"t":["EPC","EPC"],"d":["Identificador del tag. Apoyá el cursor encima para ver la trama cruda completa.","Tag identifier. Hover it to see the full raw frame."]},{"t":["Chip","Chip"],"d":["Modelo de chip deducido de la lectura (por ejemplo H9, Monza, UCODE). Si el chip no está registrado, queda pendiente.","Chip model inferred from the reading (for example H9, Monza, UCODE). If the chip is not registered, it stays pending."]},{"t":["Code W34","Code W34"],"d":["Código corto del tag: los caracteres 7 al 14 del EPC.","Short tag code: characters 7 to 14 of the EPC."]},{"t":["Excel","Excel"],"d":["Si ese EPC aparece en la base de Alejandría. Es la tercera fuente, después del chip y del patrón.","Whether that EPC appears in the Alejandría base. Third source, after the chip and the pattern."]},{"t":["Estado","State"],"d":["Cómo se confirmó el chip: lectura directa, patrón de EPC conocido o coincidencia con la base.","How the chip was confirmed: direct reading, known EPC pattern or a match in the base."]}]},"/distancia":{"title":["Ayuda · Distancia","Help · Distance"],"items":[{"t":["Etiqueta","Label"],"d":["Nombre de la tanda: el tag y la altura de la medición (por ejemplo «monza / altura 20cm»). Los puntos con la misma etiqueta se dibujan como una serie.","Name of the run: the tag and the measurement height (for example 'monza / height 20cm'). Points with the same label are drawn as one series."]},{"t":["Distancia en cm","Distance in cm"],"d":["Distancia entre el tag y la antena. Medí con el tag quieto en cada distancia y esperá a que termine la medición.","Distance between the tag and the antenna. Measure with the tag still at each distance and wait for the measurement to finish."]},{"t":["Segundos de medición","Measurement seconds"],"d":["Cuánto dura el barrido de ese punto. Usa el mismo stream en modo activo que la pestaña Barrido.","How long the sweep for that point lasts. It uses the same active-mode stream as the Sweep tab."]},{"t":["Lecturas por segundo y RSSI","Reads per second and RSSI"],"d":["Cada EPC visto en el barrido deja una fila con sus lecturas, lecturas por segundo y RSSI promedio, mínimo y máximo. Los dos gráficos muestran esas dos series contra la distancia.","Every EPC seen in the sweep leaves a row with its reads, reads per second and average, minimum and maximum RSSI. The two charts show those two series against distance."]},{"t":["H10 y lectura dirigida","H10 and directed read"],"d":["Los tags H10 no entran al stream de inventario. Para esos tags la curva queda vacía: hay que usar la lectura dirigida.","H10 tags do not enter the inventory stream. For those tags the curve stays empty: the directed read has to be used."]}]}};
function openHelp() {
  var h = HELP[location.pathname] || null;
  var box = document.getElementById('helpBody');
  document.getElementById('helpTitle').textContent = h ? (LANG === 'en' ? h.title[1] : h.title[0]) : (LANG === 'en' ? 'Help' : 'Ayuda');
  box.innerHTML = '';
  var items = h ? h.items : [];
  if (!items.length) {
    var p = document.createElement('p');
    p.className = 'opacity-70';
    p.textContent = LANG === 'en' ? 'This screen has no help yet.' : 'Esta pantalla todavia no tiene ayuda.';
    box.appendChild(p);
  }
  items.forEach(function (it) {
    var wrap = document.createElement('div');
    wrap.className = 'help-item';
    var t = document.createElement('div');
    t.className = 'font-semibold';
    t.textContent = LANG === 'en' ? it.t[1] : it.t[0];
    var d = document.createElement('div');
    d.className = 'opacity-75';
    d.textContent = LANG === 'en' ? it.d[1] : it.d[0];
    wrap.appendChild(t); wrap.appendChild(d); box.appendChild(wrap);
  });
  document.getElementById('helpModal').showModal();
}
document.getElementById('helpTopBtn').onclick = openHelp;
document.addEventListener('keydown', function (e) {
  if (e.key === 'F1') { e.preventDefault(); e.stopPropagation(); openHelp(); }
}, true);
async function downloadExport(path, payload) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
  if (!r.ok) { alert('No se pudo exportar'); return; }
  const blob = await r.blob();
  const cd = r.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename="?([^";]+)"?/);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = m ? m[1] : (payload.name || 'export');
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}
function exportTable(sel, name) {
  let tb = document.querySelector(sel);
  if (!tb) return;
  // si le pasaron el tbody, subir a la tabla para encontrar los encabezados
  if (tb.tagName === 'TBODY') tb = tb.closest('table') || tb;
  const headers = [...tb.querySelectorAll('thead th')].map(th => th.textContent.trim()).filter(Boolean);
  const rows = [...tb.querySelectorAll('tbody tr')].map(tr => [...tr.children].map(td => td.textContent.trim()))
    .filter(r => r.some(v => v));
  if (!rows.length) { alert('No hay filas para exportar todavía'); return; }
  downloadExport('/api/export/xlsx', {name: name, headers: headers, rows: rows});
}
function exportText(sel, name) {
  const el = document.querySelector(sel);
  if (!el) return;
  const txt = (el.value !== undefined && el.value !== null && el.value !== '') ? el.value : el.textContent;
  if (!txt || !txt.trim() || txt.trim() === '-') { alert('No hay texto para exportar todavía'); return; }
  downloadExport('/api/export/txt', {name: name, text: txt});
}
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  return r.json();
}
function setTheme(t) {
  try { if (window.__trace) window.__trace('setTheme:' + t); } catch (e) {}
  document.documentElement.dataset.theme = t;
  storeSet('ru5600_theme', t);
  document.querySelectorAll('input[name=theme]').forEach(function(el){ el.checked = (el.value === t); });
  var sw = document.getElementById('themeSwitch');
  if (sw) sw.checked = (t === 'dark');
  document.querySelectorAll('[data-theme-side]').forEach(function (el) {
    var on = el.getAttribute('data-theme-side') === t;
    el.classList.toggle('font-semibold', on);
    el.classList.toggle('opacity-50', !on);
  });
}
document.getElementById('themeSwitch').onchange = function () {
  setTheme(this.checked ? 'dark' : 'light');
};
document.querySelectorAll('input[name=lang]').forEach(function(el){ el.onchange = function(){ if(el.checked) applyLang(el.value); }; });
document.getElementById('langSwitch').onchange = function () { applyLang(this.checked ? 'en' : 'es'); };
setTheme(storeGet('ru5600_theme') || 'light');
var _l=storeGet('ru5600_lang')||'es'; var _r=document.querySelector('input[name=lang][value="'+_l+'"]'); if(_r)_r.checked=true; applyLang(_l);
// Inputs numéricos: seleccionar todo al enfocar. Sin esto, el valor por defecto
// (ej. el 0 del Barrido) queda al teclear y se convierte en 0400 en vez de 400.
document.querySelectorAll('input[type=number]').forEach(function (el) {
  el.addEventListener('focus', function () { el.select(); });
});

/*CSELECT-START*/
/* Dropdowns propios: reemplazan el popup NATIVO del <select>.
   - El select original se esconde pero CONSERVA id/value/disabled: todo el
     codigo que lee .value sigue igual; elegir dispara 'change' (para los
     que tienen onchange, como #perfil).
   - Un MutationObserver reconstruye el menu si JS agrega/quita opciones
     (caso #dev, que se llena al escanear) o cambia disabled.
   - El menu es contenido de la pagina: NO captura el escritorio (se cierra
     con clic afuera o Esc). Teclado: Enter/Espacio abre, Esc cierra. */
(function () {
  var OPEN_MENU = null, OPEN_WRAP = null;
  function closeCustom() {
    if (OPEN_MENU) { OPEN_MENU.setAttribute('hidden', ''); OPEN_MENU = null; OPEN_WRAP = null; }
  }
  document.addEventListener('click', function (ev) {
    if (OPEN_WRAP && !OPEN_WRAP.contains(ev.target)) closeCustom();
  }, true);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' || ev.key === '27') closeCustom();
  });

  function selectedText(sel) {
    var o = (sel.options && sel.selectedIndex >= 0) ? sel.options[sel.selectedIndex] : null;
    return o ? o.textContent : '';
  }

  function refreshBtn(wrap, sel, btn) {
    var lab = btn.querySelector('.cselect-label');
    if (lab) lab.textContent = selectedText(sel);
    btn.disabled = !!sel.disabled;
    var items = wrap.querySelectorAll('.cselect-item');
    for (var i = 0; i < items.length; i++) {
      items[i].setAttribute('aria-selected',
        items[i].getAttribute('data-value') === sel.value ? 'true' : 'false');
    }
  }

  function fireChange(sel) {
    var ev;
    try { ev = new Event('change', { bubbles: true }); }
    catch (e) {
      ev = document.createEvent('Event');
      ev.initEvent('change', true, true);
    }
    sel.dispatchEvent(ev);
  }

  function rebuildMenu(wrap, sel, menu, btn) {
    while (menu.firstChild) menu.removeChild(menu.firstChild);
    for (var i = 0; i < sel.options.length; i++) {
      (function (opt) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cselect-item';
        b.setAttribute('data-value', opt.value);
        b.setAttribute('role', 'option');
        b.textContent = opt.textContent;
        b.setAttribute('aria-selected', opt.value === sel.value ? 'true' : 'false');
        b.addEventListener('click', function () {
          if (sel.disabled) return;
          sel.value = opt.value;
          refreshBtn(wrap, sel, btn);
          closeCustom();
          fireChange(sel);
        });
        menu.appendChild(b);
      })(sel.options[i]);
    }
    refreshBtn(wrap, sel, btn);
  }

  function enhance(sel) {
    if (!sel || sel.__cselect) return;
    if (!sel.classList || !sel.classList.contains('select')) return;
    sel.__cselect = true;
    var wrap = document.createElement('span');
    var btnCls = [], wrapCls = ['cselect'];
    var parts = (sel.className || '').split(/\s+/);
    for (var i = 0; i < parts.length; i++) {
      if (!parts[i]) continue;
      if (/^select/.test(parts[i])) btnCls.push(parts[i]);
      else wrapCls.push(parts[i]);
    }
    wrap.className = wrapCls.join(' ');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = (btnCls.join(' ') + ' cselect-btn w-full').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    btn.setAttribute('aria-haspopup', 'listbox');
    var label = document.createElement('span');
    label.className = 'cselect-label';
    btn.appendChild(label);
    var menu = document.createElement('div');
    menu.className = 'cselect-menu';
    menu.setAttribute('hidden', '');
    menu.setAttribute('role', 'listbox');
    btn.addEventListener('click', function () {
      if (sel.disabled) return;
      if (OPEN_MENU === menu) { closeCustom(); return; }
      closeCustom();
      menu.removeAttribute('hidden');
      OPEN_MENU = menu; OPEN_WRAP = wrap;
    });
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    wrap.appendChild(btn);
    wrap.appendChild(menu);
    sel.style.display = 'none';
    // Sincronia con asignaciones por codigo (ej. pread() hace
    // rf.selectedIndex = r.rf al abrir Parametros): ni .value ni
    // .selectedIndex disparan MutationObserver, asi que se interceptan
    // con accesores propios que refrescan el boton. Sin esto, el boton
    // quedaba clavado en la primera opcion ("0dBm") aunque el select
    // oculto ya tuviera el valor real del lector.
    (function () {
      var curIdx = sel.selectedIndex;
      function applyIdx(i, fromNative) {
        curIdx = i;
        if (!fromNative) {
          try {
            var d = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'selectedIndex');
            if (d && d.set) d.set.call(sel, i);
          } catch (e) { /* motor sin descriptor: el estado vive en curIdx */ }
        }
        refreshBtn(wrap, sel, btn);
      }
      try {
        Object.defineProperty(sel, 'selectedIndex', {
          configurable: true,
          get: function () { return curIdx; },
          set: function (i) { applyIdx(i === -1 ? -1 : (i | 0)); }
        });
        Object.defineProperty(sel, 'value', {
          configurable: true,
          get: function () {
            var o = sel.options[curIdx];
            return o ? o.value : '';
          },
          set: function (v) {
            v = String(v);
            var idx = -1;
            for (var i = 0; i < sel.options.length; i++) {
              if (sel.options[i].value === v) { idx = i; break; }
            }
            applyIdx(idx);
          }
        });
      } catch (e) { /* sin defineProperty: el menu igual funciona por clic */ }
    })();
    rebuildMenu(wrap, sel, menu, btn);
    if (window.MutationObserver) {
      var obs = new MutationObserver(function () { rebuildMenu(wrap, sel, menu, btn); });
      obs.observe(sel, { childList: true, attributes: true, attributeFilter: ['disabled'] });
    }
  }

  function enhanceAll() {
    var list = document.querySelectorAll('select.select');
    for (var i = 0; i < list.length; i++) {
      try { enhance(list[i]); } catch (e) { /* un select roto no rompe la pagina */ }
    }
  }
  window.__refreshSelects = function () {
    var wraps = document.querySelectorAll('.cselect');
    for (var i = 0; i < wraps.length; i++) {
      var s = wraps[i].querySelector('select'), b = wraps[i].querySelector('.cselect-btn');
      if (s && b) refreshBtn(wraps[i], s, b);
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enhanceAll);
  else enhanceAll();
})();
/*CSELECT-END*/
</script>
