{% extends "base.html" %}
{% block title %}Chip info{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow-sm p-4 mb-4">
  <h2 class="text-lg font-semibold mb-3">Analizar chip</h2>
  <div class="flex flex-wrap items-end gap-3 mb-2">
    <div><label class="block text-sm mb-1" for="cpwd">Contraseña de acceso</label><input id="cpwd" value="00000000" class="input input-bordered font-mono w-48"></div>
    <button id="ctest" class="btn btn-outline">Probar contraseña</button>
    <label class="flex items-center gap-2 text-sm h-10"><input type="checkbox" class="checkbox checkbox-sm" id="cdeep"> Barrido profundo (mapa de memoria)</label>
    <button id="cgo" class="btn btn-primary">Analizar chip</button>
  </div>
  <pre id="cout" class="font-mono text-sm whitespace-pre-wrap">Poné un tag y apretá Analizar.</pre>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('ctest').onclick = async () => {
  const r = await post('/api/pwd_test', {pwd: document.getElementById('cpwd').value});
  document.getElementById('cout').textContent = r.ok ? 'Contraseña OK.' : 'RECHAZADA: ' + r.error;
};
document.getElementById('cgo').onclick = async () => {
  document.getElementById('cout').textContent = 'Analizando...';
  const r = await post('/api/chip_analyze', {pwd: document.getElementById('cpwd').value, deep: document.getElementById('cdeep').checked});
  document.getElementById('cout').textContent = r.ok ? r.report : 'Error: ' + r.error;
};
</script>
{% endblock %}
