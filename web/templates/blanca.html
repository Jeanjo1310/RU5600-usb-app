{% extends "base.html" %}
{% block title %}Lista blanca{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow-sm p-4 mb-4">
  <h2 class="text-lg font-semibold mb-3">Lista blanca <span id="wlcount" class="text-sm text-gray-500"></span></h2>
  <div class="flex flex-wrap gap-2 mb-2">
    <button id="wlref" class="btn btn-outline">Actualizar</button>
    <button id="wlclear" class="btn btn-outline">Borrar todas</button>
  </div>
  <div class="overflow-x-auto"><table class="table table-zebra w-full text-sm"><thead class="text-xs uppercase opacity-70"><tr><th class="px-4 py-2">#</th><th class="px-4 py-2">Entrada</th><th class="px-4 py-2"></th></tr></thead><tbody id="wlrows"></tbody></table></div>
</div>
<div class="card bg-base-100 shadow-sm p-4">
  <h2 class="text-lg font-semibold mb-3">Agregar (32 bytes hex)</h2>
  <div class="flex flex-wrap gap-2">
    <input id="wldata" placeholder="32 bytes hex" class="input input-bordered font-mono flex-1">
    <button id="wladd" class="btn btn-primary">Agregar</button>
  </div>
  <h2 class="text-lg font-semibold mt-4 mb-3">Importar (una por línea)</h2>
  <textarea id="wltext" rows="3" class="input input-bordered w-full font-mono"></textarea>
  <button id="wlimp" class="mt-2 btn btn-primary">Importar</button>
  <p id="wlmsg" class="mt-1 text-sm"></p>
</div>
{% endblock %}
{% block scripts %}
<script>
async function wlrefresh() {
  const r = await fetch('/api/wl/list').then(r => r.json());
  const tb = document.getElementById('wlrows'); tb.innerHTML = '';
  (r.entries || []).forEach((e, i) => {
    const tr = document.createElement('tr'); tr.className = 'border-b border-base-300';
    tr.innerHTML = `<td class="px-4 py-2">${i}</td><td class="px-4 py-2 font-mono">${e}</td><td class="px-4 py-2"><button class="text-red-600" data-e="${e}">Borrar</button></td>`;
    tb.appendChild(tr);
  });
  document.querySelectorAll('#wlrows button').forEach(b => b.onclick = async () => { await post('/api/wl/del', {hex: b.dataset.e}); wlrefresh(); });
  document.getElementById('wlcount').textContent = (r.entries || []).length + ' entradas';
}
document.getElementById('wlref').onclick = wlrefresh;
document.getElementById('wlclear').onclick = async () => { if (confirm('¿Borrar toda la lista?')) { await post('/api/wl/clear', {}); wlrefresh(); } };
document.getElementById('wladd').onclick = async () => {
  const r = await post('/api/wl/add', {hex: document.getElementById('wldata').value});
  document.getElementById('wlmsg').textContent = r.ok ? 'Agregada.' : 'Error: ' + r.error; wlrefresh();
};
document.getElementById('wlimp').onclick = async () => {
  const r = await post('/api/wl/import', {text: document.getElementById('wltext').value});
  document.getElementById('wlmsg').textContent = r.ok ? `Importadas: ${r.n}.` : 'Error: ' + r.error; wlrefresh();
};
wlrefresh();
</script>
{% endblock %}
